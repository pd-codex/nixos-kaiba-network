name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting, unit tests, and module evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false
          extra_nix_config: |
            extra-substituters = https://nixos-kaiba-network.cachix.org
            extra-trusted-public-keys = nixos-kaiba-network.cachix.org-1:BCAt/P9Fo2JFexLB4T7eB3o0csSQI/Dy+hx+3RwzA8U=
          github_access_token: ${{ github.token }}

      - name: Publish reusable outputs to the project binary cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: nixos-kaiba-network
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipAddingSubstituter: true
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Check formatting
        run: nix --accept-flake-config fmt -- --ci

      - name: Evaluate every flake system
        run: |
          nix --accept-flake-config flake check --all-systems --no-build -L
          nix flake check ./nix/dns --all-systems --no-build -L
          git diff --exit-code -- flake.lock nix/dns/flake.lock

      - name: Run fast checks
        run: |
          nix --accept-flake-config build --no-link -L \
            .#checks.x86_64-linux.ci-workflow \
            .#checks.x86_64-linux.module-eval \
            .#checks.x86_64-linux.report-unit \
            .#checks.x86_64-linux.unit

  aarch64-packages:
    name: ARM64 DNS packages
    needs: quality
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false
          extra_nix_config: |
            extra-substituters = https://nixos-kaiba-network.cachix.org
            extra-trusted-public-keys = nixos-kaiba-network.cachix.org-1:BCAt/P9Fo2JFexLB4T7eB3o0csSQI/Dy+hx+3RwzA8U=
          github_access_token: ${{ github.token }}

      - name: Build and test DNS outputs
        run: |
          nix --accept-flake-config build --no-link -L \
            .#checks.aarch64-linux.ci-workflow \
            .#checks.aarch64-linux.module-eval \
            .#checks.aarch64-linux.unit \
            .#packages.aarch64-linux.kaiba-agent \
            .#packages.aarch64-linux.kaiba-controller \
            .#packages.aarch64-linux.kaiba-publisher

  dns-integration:
    name: Seven-VM DNS topology and canonical report
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      pages_artifact_id: ${{ steps.pages_artifact.outputs.artifact_id }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix with NixOS test support
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: true
          extra_nix_config: |
            extra-substituters = https://nixos-kaiba-network.cachix.org
            extra-trusted-public-keys = nixos-kaiba-network.cachix.org-1:BCAt/P9Fo2JFexLB4T7eB3o0csSQI/Dy+hx+3RwzA8U=
            system-features = nixos-test benchmark big-parallel kvm
          github_access_token: ${{ github.token }}

      - name: Report virtualization mode
        run: |
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM acceleration is available."
          else
            echo "::warning title=KVM unavailable::The topology will use its slower QEMU TCG fallback."
          fi

      - name: Build the canonical DNS test report
        run: nix --accept-flake-config build .#dns-test-report --out-link result -L

      - name: Verify the report manifest
        id: verify_report
        working-directory: result
        run: sha256sum --check manifest.sha256

      - name: Enforce schema, security, and functional gates
        run: |
          nix --accept-flake-config build --no-link -L \
            .#dns-schema-gate \
            .#dns-security-gate \
            .#dns-test-gate

      - name: Collect the DNS test report
        id: collect_report
        if: ${{ always() }}
        run: |
          if [[ ! -e result ]]; then
            echo "::error title=Report unavailable::The report derivation did not produce an output."
            exit 1
          fi
          mkdir -p ci-report
          cp --recursive --dereference result/. ci-report/

      - name: Upload the DNS test report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaiba-dns-test-report
          path: ci-report/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Assemble and validate the GitHub Pages site
        id: assemble_pages
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.verify_report.outcome == 'success' && steps.collect_report.outcome == 'success' }}
        run: |
          if [[ -e site/reports ]]; then
            echo "::error title=Reserved site path::site/reports is reserved for generated reports."
            exit 1
          fi
          if [[ -e pages-site ]]; then
            echo "::error title=Reserved build path::pages-site must not exist before assembly."
            exit 1
          fi
          mkdir -p pages-site/reports/latest
          cp --recursive --no-dereference site/. pages-site/
          cp --recursive --no-dereference ci-report/. pages-site/reports/latest/
          nix develop ./nix/dns --command python3 tests/site/validate.py pages-site

      - name: Upload the project site for GitHub Pages
        id: pages_artifact
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.assemble_pages.outcome == 'success' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-site/
          retention-days: 1

  deploy-report:
    name: Publish project site
    needs: dns-integration
    if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.dns-integration.outputs.pages_artifact_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy the project site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
