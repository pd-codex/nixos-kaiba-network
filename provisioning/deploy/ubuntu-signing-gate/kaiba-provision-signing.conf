# Runtime PIN source: root-only tmpfs. The file itself is created interactively.
d /run/kaiba-provision-signing-credentials 0700 root root -

# Durable anti-replay state: accessible only to the signing service identity.
d /var/lib/kaiba-provision-signing 0700 kaiba-signing kaiba-signing -

# Secret-free authenticated exports, kept outside the gate's anti-replay state.
d /var/lib/kaiba-provision-signing-exports 0700 kaiba-signing kaiba-signing -
